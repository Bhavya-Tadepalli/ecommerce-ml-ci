
name: Ecommerce ML CI and CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  train-test-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train ecommerce model
        run: python train_model.py

      - name: Run ML quality gate
        run: python quality_gate.py

      - name: Run ML tests
        run: pytest -v test_model.py

      - name: Run application tests
        run: pytest -v test_app.py

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ecommerce-ml-release
          path: |
            artifacts/ecommerce_pipeline.joblib
            artifacts/metrics.json
            app.py
          retention-days: 7
